[project]
version = "0.63.0"
name = "Clarity"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "aiohappyeyeballs",
  "aiohttp",
  "aiosignal",
  "ansicon",
  "anyio",
  "argcomplete",
  "attrs",
  "blessed",
  "certifi",
  "cffi",
  "charset-normalizer",
  "click",
  "colorama",
  "frozenlist",
  "h11",
  "halo",
  "httpcore",
  "httpx",
  "idna",
  "importlib-resources",
  "jedi",
  "jinxed",
  "log-symbols",
  "lxml",
  "materialyoucolor",
  "multidict",
  "mypy",
  "mypy_extensions",
  "Nuitka",
  "ordered-set",
  "packaging",
  "parso",
  "pathspec",
  "pillow",
  "pip-review",
  "platformdirs",
  "propcache",
  "protobuf",
  "psutil",
  "pudb",
  "pycparser",
  "Pygments",
  "pypresence",
  "PySide6",
  "PySide6-stubs @ https://github.com/kaneryu/PySide6-stubs/archive/main.zip",
  "PySide6_Addons",
  "PySide6_Essentials",
  "python-vlc",
  "requests",
  "shiboken6",
  "six",
  "sniffio",
  "spinners",
  "termcolor",
  "tinytag",
  "toml",
  "typing_extensions",
  "urllib3",
  "urwid",
  "urwid_readline",
  "userpath",
  "wcwidth",
  "yarl",
  "yt-dlp",
  "ytmusicapi @ https://github.com/kaneryu/ytmusicapi/archive/async-new.zip",
  "zstandard",
  "pyside6-live-coding",
  "python-qt-live-coding",
  "python-mpv",
  "dacite",
  "winrt-Windows.Media.Control; sys_platform == 'win32'",
  "pyobjc-framework-MediaPlayer; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = [
  "austin-dist",
  "austin-python",
  "austin-tui",
  "austin-web",
]
dev = [
  "black",
  "isort",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "pytest-xdist",
  "tox",
]
ci = [
  "python-semantic-release",
]

[tool.pytest.ini_options]
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
# tests import as `src.<pkg>`; keeps a bare `pytest` working without an
# editable install having been done first.
pythonpath = ["."]
